name: verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FightLab
        uses: actions/checkout@v4
        with:
          path: FightLab

      - name: Check PR diff whitespace
        if: github.event_name == 'pull_request'
        working-directory: FightLab
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Read pinned Boneyard commit
        id: boneyard
        shell: bash
        run: echo "commit=$(node -p "require('./FightLab/boneyard.pin.json').commit")" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Boneyard
        uses: actions/checkout@v4
        with:
          repository: SouthernGentlemen/Boneyard
          ref: ${{ steps.boneyard.outputs.commit }}
          path: Boneyard
          token: ${{ secrets.BONEYARD_READ_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FightLab/package-lock.json

      - name: Install FightLab
        working-directory: FightLab
        run: npm ci

      - name: Check
        working-directory: FightLab
        run: npm run check

      - name: Observe live GitHub settings
        continue-on-error: true
        working-directory: FightLab
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run verify:github-settings
